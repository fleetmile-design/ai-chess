<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Šachmatai — Gyvas mačas</title>

  <!-- chessboard.js CSS (served locally) -->
  <link rel="stylesheet" href="/static/vendor/chessboard.min.css" />

  <!-- Application CSS -->
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <header>
    <h1>♟ AI Šachmatai — Gyvas mačas ♟</h1>
  </header>

  <main class="main-grid">
    <!-- Left panel: White AI log -->
    <section class="log-panel panel-white" aria-label="Baltojo AI žurnalas">
      <div class="panel-header">
        <span class="panel-icon">⬜</span> Baltasis AI
      </div>
      <div class="log-content" id="balti-ai-log"></div>
    </section>

    <!-- Center: chess board + controls -->
    <section class="board-section">
      <div class="board-controls">
        <div class="model-selectors">
          <div class="model-selector-group">
            <label for="white-model-select">⬜ Baltasis AI</label>
            <select id="white-model-select" class="model-select">
              <option value="mock" selected>Mock AI</option>
              <option value="gpt-4o">GPT-4o</option>
              <option value="gpt-4o-mini">GPT-4o Mini</option>
              <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
              <option value="gemini-1.5-pro">Gemini 1.5 Pro</option>
              <option value="claude-3-5-sonnet">Claude 3.5 Sonnet</option>
              <option value="llama-3">Llama 3</option>
            </select>
          </div>
          <div class="model-selector-group">
            <label for="black-model-select">⬛ Juodasis AI</label>
            <select id="black-model-select" class="model-select">
              <option value="mock" selected>Mock AI</option>
              <option value="gpt-4o">GPT-4o</option>
              <option value="gpt-4o-mini">GPT-4o Mini</option>
              <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
              <option value="gemini-1.5-pro">Gemini 1.5 Pro</option>
              <option value="claude-3-5-sonnet">Claude 3.5 Sonnet</option>
              <option value="llama-3">Llama 3</option>
            </select>
          </div>
        </div>
        <button id="start-btn" class="start-button">
          ▶ Pradėti žaidimą
        </button>
      </div>

      <div id="chess-board"></div>

      <div class="status-bar" id="status-bar">
        Laukiama žaidimo pradžios…
      </div>
    </section>

    <!-- Right panel: Black AI log -->
    <section class="log-panel panel-black" aria-label="Juodojo AI žurnalas">
      <div class="panel-header">
        <span class="panel-icon">⬛</span> Juodasis AI
      </div>
      <div class="log-content" id="juodi-ai-log"></div>
    </section>

    <!-- Bottom: Referee log -->
    <section class="log-panel panel-referee referee-panel" aria-label="Teisėjo žurnalas">
      <div class="panel-header">
        <span class="panel-icon">&#9878;</span> Teisėjas (Žaidimo žurnalas)
      </div>
      <div class="log-content" id="teisejas-log"></div>
    </section>

    <!-- Leaderboard -->
    <section class="leaderboard-panel" aria-label="Turnyro lentelė">
      <div class="panel-header">
        <span class="panel-icon">&#127942;</span> Turnyro lentelė (Leaderboard)
      </div>
      <div class="leaderboard-content">
        <table id="leaderboard-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Modelis</th>
              <th>ELO</th>
              <th>Žaidimai</th>
              <th>W</th>
              <th>L</th>
              <th>D</th>
              <th>Win%</th>
            </tr>
          </thead>
          <tbody id="leaderboard-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Game-over overlay -->
  <div id="game-over-overlay" class="game-over-overlay hidden">
    <div class="game-over-box">
      <div class="game-over-title">Žaidimas baigtas!</div>
      <div class="game-over-result" id="game-over-result"></div>
      <div class="game-over-reason" id="game-over-reason"></div>
      <button id="new-game-btn" class="start-button">↺ Naujas žaidimas</button>
    </div>
  </div>

  <!-- jQuery (required by chessboard.js, served locally) -->
  <script src="/static/vendor/jquery.min.js"></script>
  <!-- chess.js (served locally) -->
  <script src="/static/vendor/chess.min.js"></script>
  <!-- chessboard.js (served locally) -->
  <script src="/static/vendor/chessboard.min.js"></script>
  <!-- Socket.IO client (served locally) -->
  <script src="/static/vendor/socket.io.min.js"></script>
  <!-- Application JS -->
  <script src="/static/js/app.js"></script>
</body>
</html>
